name: Diagnose SSE
on:
  push:
    branches: [fix/recover-main-integration]
permissions:
  contents: read
jobs:
  sse:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/integration.spec.ts -g "one native SSE leader" --reporter=line
