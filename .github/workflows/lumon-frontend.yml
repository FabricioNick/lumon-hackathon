name: Frontend verification
on:
  push:
    branches: [main, feat/core-auth-deploy]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - name: Enforce initial JavaScript budget
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import { gzipSync } from "node:zlib";
            const bundles = fs.readdirSync("dist/assets").filter(name => /^index-.*\.js$/.test(name));
            const size = bundles.reduce((total, name) => total + gzipSync(fs.readFileSync("dist/assets/" + name)).length, 0);
            console.log("Initial JavaScript:", size, "bytes gzipped");
            if (size > 180 * 1024) process.exit(1);
          '
