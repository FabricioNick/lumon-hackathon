name: Format recovery branch
on:
  push:
    branches: [fix/recover-main-integration]
permissions:
  contents: write
jobs:
  prettier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format
      - name: Commit formatted source to recovery branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests playwright.config.ts vite.config.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Prettier to integrated source"
            git push origin HEAD:fix/recover-main-integration
          fi
