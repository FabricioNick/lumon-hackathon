name: Format core repairs
on:
  push:
    branches: [fix/recover-main-integration]
permissions:
  contents: write
jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx prettier --write src/app/router.tsx src/core/auth/tokenStore.ts src/core/auth/authService.ts src/core/events/eventService.ts
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/router.tsx src/core/auth/tokenStore.ts src/core/auth/authService.ts src/core/events/eventService.ts
          if ! git diff --cached --quiet; then
            git commit -m "style: format final core fixes"
            git push origin HEAD:fix/recover-main-integration
          fi
